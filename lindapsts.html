<!DOCTYPE html>
<html lang="en">
<head class=" ">

<body class="bg-blue-200 items-center justify-center">
    <header>
        <h1 class="text-xl font-bold text-center">student creativity festival</h1>
        <p class="text-center ">showcase your creativity, skills, and innovative ideas</p>
    </header >
      <!-- div for card -->
     <div class="w-full max-w-sm bg-indigo-300 rounded-2xl shadow-2xl overflow-hidden p-4 mx-auto mt-10">
      <!-- div for avatar / header-->    
   
    <main>
        
  
         <h2 class=" text-lg font-semibold mb-3 text-blue-700">Isi Formulir</h2>
    <p>Catatan: Isi formulir dengan teliti, dan jawab apa adanya sesuai kemampuan diri!</p>
             <form  class="text-xs font-bold tracking-wider text-black-200 mb-2 method="post" class="space-y-3">
                    <div>
                        <label for="name" class=" text-xs font-semibold">Name:</label>

                        placeholder="enter your full name" class=" w-full px-3 py-2 text-xs bg-blue-200 text-gray-800

                    </div>
                     <div>
                        <label for="Class">Class:</label >
                            <select>
                                <option>X</option>
                                 <option>XI</option>
                                  <option>XII</option>
                            </select>

                    </div>
                    <div>
                        <label for="Gender">Gender:</label ><br>
                         <input type="radio" id="html" name="fav_language" value="HTML">
                         <label for="html">male</label>
                         <input type="radio" id="html" name="fav_language" value="HTML">
                         <label for="html">female</label>
                    </div>
                      <div>
                        <label for="Competition">Kompetisi apa yang ingin di ikuti:</label >
                        <select>
                            <option>web development</option>
                            <option>iot project</option>
                            <option>grafik design</option>
                            <option>publicspeaking</option>
                            <option>photography</option>
                        </select><br>
                    </div>
                    <div>
                        <!- - label for the question
                        <label for="Gender">partisipation type:</label ><br>

                         <input type="radio" id="html" id="male">
                         <!- - label for

                         <label for="html">individual</label>

                         <input type="radio" id="html" name="fav_language" value="HTML">

                         <label for="html">team</label>
                    </div>
                    <div>
                        <label for="message">Alasan ingin mengikuti Kompetisi:</label >
                        <textarea id="message" name=""  
                        placeholder="Your reason" class=" w-full px-3 py-2 text-xs bg-blue-200 text-gray-800
                         rounded border border-pink-400/80 focus:outline-none focus:border-purple-500 placeholder-pink-400" required></textarea><br></br>
                    </div>
                     <label for="Number" class="bg-blue-200">Contact Number</label >
                        <input type="text" id=" id=class"  
                        placeholder="Your Number" class=" w-full px-3 py-2 text-xs bg-blue-200 text-gray-800
                         rounded border border-pink-400/80 focus:outline-none focus:border-purple-500 placeholder-pink-400" required/><br></br>
                    </div>
                    <button type="submit">Submit</button>
                     <!-- Skills Section -->
         <section id="skills" class="bg-blue-100 p-6 rounded-lg border shadow-sm mb-6">
        
                    
                </form>
        </h3>
